<svg class="flow-svg" viewBox="0 0 1000 530" role="img" aria-label="How GEN-E works. Stakeholders contribute parts. AI agents scan, check safety and design. The materials database remembers each part. Approved items go out to makers and the city." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- column headers -->
  <g class="cols">
    <text x="120" y="24">WHO</text>
    <text x="340" y="24">AI AGENTS</text>
    <text x="580" y="24">CORE</text>
    <text x="830" y="24">WHAT GETS BUILT</text>
  </g>

  <!-- connectors (ids drive the moving packets) -->
  <g class="links">
    <path id="l1" class="link" d="M144 100H306"/>
    <path id="l2" class="link" d="M144 210H306"/>
    <path id="l3" class="link" d="M144 320H306"/>
    <path id="l4" class="link" d="M144 430H306"/>
    <path id="l5" class="link" d="M374 100H546"/>
    <path id="l6" class="link" d="M374 210C462 210 466 255 552 255"/>
    <path id="l7" class="link" d="M374 320C462 320 466 275 552 275"/>
    <path id="l8" class="link" d="M374 430H556"/>
    <path id="l9" class="link" d="M614 100H690"/>
    <path id="l10" class="link" d="M610 265H690"/>
    <path id="l11" class="link" d="M604 430H690"/>
    <path class="bus" d="M690 100V430"/>
    <path id="o1" class="link" d="M690 100H806"/>
    <path id="o2" class="link" d="M690 210H806"/>
    <path id="o3" class="link" d="M690 320H806"/>
    <path id="o4" class="link" d="M690 430H806"/>
    <path id="loop" class="loop" d="M830 502V520H120V502"/>
  </g>

  <!-- packets -->
  <g class="packets">
    <circle class="dot" r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.6s" begin="-1.7s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.6s" begin="-0.4s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.2s" begin="-0.3s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.4s" begin="-1.1s" repeatCount="indefinite"><mpath href="#l6"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.4s" begin="-0.2s" repeatCount="indefinite"><mpath href="#l7"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="2.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#l8"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#l9"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.6s" begin="-0.1s" repeatCount="indefinite"><mpath href="#l10"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.6s" begin="-1s" repeatCount="indefinite"><mpath href="#l11"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.8s" begin="-0.4s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.8s" begin="-0.1s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="1.8s" begin="-1.6s" repeatCount="indefinite"><mpath href="#o4"/></animateMotion></circle>
    <circle class="dot" r="3"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
  </g>

  <!-- WHO: stakeholders -->
  <g class="node stake" transform="translate(120 100)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-truck" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Contributors</text>
    <text class="s" y="63">demolition · scrap</text>
  </g>
  <g class="node stake" transform="translate(120 210)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-city" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">City &amp; regulators</text>
    <text class="s" y="63">approve · safety rules</text>
  </g>
  <g class="node stake" transform="translate(120 320)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-pen" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Designers &amp; planners</text>
    <text class="s" y="63">pick items · edit</text>
  </g>
  <g class="node stake" transform="translate(120 430)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-wrench" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Makers &amp; crews</text>
    <text class="s" y="63">fabricate · install</text>
  </g>

  <!-- AI AGENTS: an AI chip with pins, an orbit ring, and a function badge on the ring -->
  <g class="node agent" transform="translate(340 100)">
    <circle class="orbit" r="34"/>
    <g class="chipgfx">
      <path class="pin" d="M-11 -18V-25M0 -18V-25M11 -18V-25M-11 18V25M0 18V25M11 18V25M-18 -11H-25M-18 0H-25M-18 11H-25M18 -11H25M18 0H25M18 11H25"/>
      <rect class="chip" x="-17" y="-17" width="34" height="34" rx="7"/>
      <text class="ai" x="0" y="4">AI</text>
    </g>
    <g class="badge" transform="translate(23 23)"><circle r="9"/><use href="#i-scan" x="-6.5" y="-6.5" width="13" height="13"/></g>
    <text class="t" y="46">Intake AI</text>
    <text class="s" y="63">photo to 3D + info</text>
  </g>
  <g class="node agent" transform="translate(340 210)">
    <circle class="orbit" r="34"/>
    <g class="chipgfx" style="animation-delay:-1.1s">
      <path class="pin" d="M-11 -18V-25M0 -18V-25M11 -18V-25M-11 18V25M0 18V25M11 18V25M-18 -11H-25M-18 0H-25M-18 11H-25M18 -11H25M18 0H25M18 11H25"/>
      <rect class="chip" x="-17" y="-17" width="34" height="34" rx="7"/>
      <text class="ai" x="0" y="4">AI</text>
    </g>
    <g class="badge" transform="translate(23 23)"><circle r="9"/><use href="#i-shield" x="-6.5" y="-6.5" width="13" height="13"/></g>
    <text class="t" y="46">Safety agent</text>
    <text class="s" y="63">flags · cleared only</text>
  </g>
  <g class="node agent" transform="translate(340 320)">
    <circle class="orbit" r="34"/>
    <g class="chipgfx" style="animation-delay:-2.2s">
      <path class="pin" d="M-11 -18V-25M0 -18V-25M11 -18V-25M-11 18V25M0 18V25M11 18V25M-18 -11H-25M-18 0H-25M-18 11H-25M18 -11H25M18 0H25M18 11H25"/>
      <rect class="chip" x="-17" y="-17" width="34" height="34" rx="7"/>
      <text class="ai" x="0" y="4">AI</text>
    </g>
    <g class="badge" transform="translate(23 23)"><circle r="9"/><use href="#i-spark" x="-6.5" y="-6.5" width="13" height="13"/></g>
    <text class="t" y="46">Generation AI</text>
    <text class="s" y="63">forms urban items</text>
  </g>
  <g class="node agent" transform="translate(340 430)">
    <circle class="orbit" r="34"/>
    <g class="chipgfx" style="animation-delay:-0.6s">
      <path class="pin" d="M-11 -18V-25M0 -18V-25M11 -18V-25M-11 18V25M0 18V25M11 18V25M-18 -11H-25M-18 0H-25M-18 11H-25M18 -11H25M18 0H25M18 11H25"/>
      <rect class="chip" x="-17" y="-17" width="34" height="34" rx="7"/>
      <text class="ai" x="0" y="4">AI</text>
    </g>
    <g class="badge" transform="translate(23 23)"><circle r="9"/><use href="#i-brush" x="-6.5" y="-6.5" width="13" height="13"/></g>
    <text class="t" y="46">Manual creation agent</text>
    <text class="s" y="63">human edits · suggests</text>
  </g>

  <!-- CORE -->
  <g class="node" transform="translate(580 100)">
    <circle class="orbit" r="34"/>
    <circle class="hub" r="24"/>
    <use class="ic hot" href="#i-hub" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Agent orchestrator</text>
    <text class="s" y="63">plans · tools · memory</text>
  </g>
  <g class="node" transform="translate(580 265)">
    <circle class="hub big" r="30"/>
    <use class="ic hot" href="#i-db" x="-12" y="-12" width="24" height="24"/>
    <text class="t" y="48">Materials DB</text>
    <text class="s" y="65">parts · dims · tags</text>
  </g>
  <g class="node" transform="translate(580 430)">
    <circle class="hub" r="24"/>
    <use class="ic hot" href="#i-leaf" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Impact agent</text>
    <text class="s" y="63">CO₂e · QAR · weeks</text>
  </g>

  <!-- WHAT GETS BUILT -->
  <g class="node" transform="translate(830 100)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-dumbbell" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Parks &amp; play</text>
    <text class="s" y="63">gyms · play domes</text>
  </g>
  <g class="node" transform="translate(830 210)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-bus" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Transit &amp; shade</text>
    <text class="s" y="63">shelters · canopies</text>
  </g>
  <g class="node" transform="translate(830 320)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-steps" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Squares &amp; steps</text>
    <text class="s" y="63">steps · skate bowl</text>
  </g>
  <g class="node" transform="translate(830 430)">
    <circle class="ring" r="24"/>
    <use class="ic" href="#i-arch" x="-11" y="-11" width="22" height="22"/>
    <text class="t" y="46">Bridges &amp; walls</text>
    <text class="s" y="63">footbridges · murals</text>
  </g>

  <text class="route" x="475" y="514">build + deliver back to the city</text>
</svg>
